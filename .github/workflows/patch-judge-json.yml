name: Patch judge JSON robustness

on:
  push:
    branches:
      - fix/judge-criteria-json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch judge prompt, recovery and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('src/adapters/ai/ollamaProvider.ts')
          text = provider.read_text()
          old = """        const selectCriteria = (result: { criteria: Array<{ criterionId: string; points: number; rationale: string; evidence: string; confidence: string; questionForTeacher?: string }> }) => ({
          criteria: result.criteria.filter((criterion) => disputedIds.has(criterion.criterionId)),
        });
        const arbitrationPrompt = [
          'Tu es le juge final. Arbitre uniquement les critères litigieux entre deux évaluateurs.',
          'Pour chaque critère fourni, décide les points finaux à partir du barème et de la transcription. Ne refais pas une correction générale et ne moyenne pas les deux avis pour les critères litigieux.',
          'Retourne uniquement un JSON valide avec finalScore, summary, criteria et questionsForTeacher. criteria doit contenir exactement les critères fournis, avec criterionId, points, rationale, evidence, confidence et questionForTeacher. finalScore est la somme des points des critères fournis.',
          `BARÈME :\\n${JSON.stringify(disputedRubric)}`,
          `TRANSCRIPTION :\\n${transcription ?? ''}`,
          `AVIS 1 :\\n${JSON.stringify(selectCriteria(firstProposal))}`,
          `AVIS 2 :\\n${JSON.stringify(selectCriteria(secondProposal))}`,
        ].join('\\n\\n');
        const startedAt = Date.now();
        const raw = await sendStream(arbitratorModel, arbitrationPrompt, undefined, onChunk, true, settings.thinking ?? false);
        const judged = parseGradingProposal(raw, disputedRubric);
"""
          new = """        const selectCriteria = (result: { criteria: Array<{ criterionId: string; points: number; rationale: string; evidence: string; confidence: string; questionForTeacher?: string }> }) => ({
          criteria: result.criteria.filter((criterion) => disputedIds.has(criterion.criterionId)),
        });
        const judgeCriteriaTemplate = disputedRubric.criteria.map((criterion) => ({
          criterionId: criterion.id,
          points: 0,
          rationale: 'justification concise de la décision',
          evidence: 'preuve courte issue de la transcription',
          confidence: 'high',
          questionForTeacher: '',
        }));
        const arbitrationPrompt = [
          'Tu es le juge final. Arbitre uniquement les critères litigieux entre deux évaluateurs.',
          'Pour chaque critère fourni, décide les points finaux à partir du barème et de la transcription. Ne refais pas une correction générale et ne moyenne pas les deux avis pour les critères litigieux.',
          'Retourne uniquement un JSON valide. Le tableau criteria est obligatoire : il doit contenir exactement une entrée pour CHAQUE critère fourni, même si tu reprends exactement l’un des deux avis. N’omets jamais criteria.',
          `STRUCTURE OBLIGATOIRE À REMPLIR : ${JSON.stringify({ finalScore: 0, summary: 'décision finale', criteria: judgeCriteriaTemplate, questionsForTeacher: [] })}`,
          'finalScore est la somme exacte des points des critères fournis. N’ajoute aucun texte hors JSON et aucun champ alternatif.',
          `BARÈME :\\n${JSON.stringify(disputedRubric)}`,
          `TRANSCRIPTION :\\n${transcription ?? ''}`,
          `AVIS 1 :\\n${JSON.stringify(selectCriteria(firstProposal))}`,
          `AVIS 2 :\\n${JSON.stringify(selectCriteria(secondProposal))}`,
        ].join('\\n\\n');
        const startedAt = Date.now();
        let raw = await sendStream(arbitratorModel, arbitrationPrompt, undefined, onChunk, true, settings.thinking ?? false);
        let judged;
        try {
          judged = parseGradingProposal(raw, disputedRubric);
        } catch (firstError) {
          const repairPrompt = [
            'Répare uniquement la sortie JSON de l’arbitrage précédent. Ne réanalyse pas la copie et ne change pas les décisions sans nécessité.',
            'Retourne UNIQUEMENT un objet JSON valide. Le tableau criteria est obligatoire et doit contenir exactement les critères indiqués ci-dessous.',
            `CRITÈRES À RETOURNER : ${JSON.stringify(judgeCriteriaTemplate)}`,
            `SORTIE À RÉPARER : ${raw}`,
          ].join('\\n\\n');
          raw = await sendStream(arbitratorModel, repairPrompt, undefined, onChunk, true, false);
          try {
            judged = parseGradingProposal(raw, disputedRubric);
          } catch {
            throw firstError;
          }
        }
"""
          if old not in text:
              raise SystemExit('judge block anchor not found')
          provider.write_text(text.replace(old, new, 1))

          test = Path('src/adapters/ai/ollamaJudgeJsonRecovery.test.ts')
          test.write_text(r'''import { describe, expect, it, vi } from 'vitest';
import { createOllamaProvider } from './ollamaProvider.ts';
import type { GradingRequest, OllamaSettings } from '../../ports/aiProvider.ts';

const rubric = JSON.stringify({ title: 'Biologie', criteria: [{ id: 'litige', title: 'Critère litigieux', description: 'Justification', maxPoints: 5 }] });
const request: GradingRequest = { question: 'Question', rubric, transcription: 'Réponse de l’étudiant.' };
const proposal = (points: number) => JSON.stringify({ finalScore: points, summary: 'Avis', criteria: [{ criterionId: 'litige', points, rationale: 'R', evidence: 'E', confidence: 'high', questionForTeacher: '' }], questionsForTeacher: [] });
const streamResponse = (content: string) => new Response(JSON.stringify({ message: { content } }) + '\n', { status: 200, headers: { 'Content-Type': 'application/x-ndjson' } });

const settings = (): OllamaSettings => ({ endpoint: 'http://localhost:11434', visionModel: 'vision', analysisModel: 'model-one', secondAnalysisModel: 'model-two', arbitratorModel: 'judge', diagnosticStrategy: 'arbitrate' });

describe('judge JSON recovery', () => {
  it('retries only when the judge omits the criteria list', async () => {
    const bodies: Array<{ model: string; messages: Array<{ content: string }> }> = [];
    const fetchMock = vi.fn(async (_input: RequestInfo | URL, init?: RequestInit) => {
      const body = JSON.parse(String(init?.body)) as typeof bodies[number];
      bodies.push(body);
      if (body.model === 'model-one') return streamResponse(proposal(2));
      if (body.model === 'model-two') return streamResponse(proposal(4));
      if (bodies.filter((item) => item.model === 'judge').length === 1) return streamResponse('{"finalScore":3,"summary":"arbitrage"}');
      return streamResponse(proposal(3));
    });

    const provider = createOllamaProvider(settings(), fetchMock as typeof fetch);
    const raw = await provider.generate(request);
    const final = JSON.parse(raw) as { finalScore: number; criteria: Array<{ criterionId: string; points: number }> };

    expect(bodies).toHaveLength(4);
    expect(bodies[2].model).toBe('judge');
    expect(bodies[3].model).toBe('judge');
    expect(bodies[3].messages[0].content).toContain('CRITÈRES À RETOURNER');
    expect(final.criteria).toEqual([{ criterionId: 'litige', points: 3 }]);
    expect(final.finalScore).toBe(3);
  });
});
''')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/ai/ollamaProvider.ts src/adapters/ai/ollamaJudgeJsonRecovery.test.ts
          git commit -m "fix(arbitration): recover judge JSON missing criteria"
          git push
      - name: Remove patch workflow
        run: |
          git rm .github/workflows/patch-judge-json.yml
          git commit -m "chore: remove temporary judge JSON patch workflow"
          git push
