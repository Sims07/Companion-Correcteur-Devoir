name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:coverage:core
      - name: Recalculate coverage badge
        run: npm run test:coverage:report
      - name: Commit updated coverage badge on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- badges/coverage.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add badges/coverage.json
            git commit -m "chore: update coverage badge [skip ci]"
            git push origin HEAD:main
          fi
      - run: npm run build
      - name: Run browser-level diagnostic workflow tests
        run: npm run test:e2e
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-unit/
            coverage-unit-core/
          if-no-files-found: ignore
          retention-days: 14
