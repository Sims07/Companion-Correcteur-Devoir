name: Tests

on:
  pull_request:
  push:
    branches: [main]
    # Badge-only commits deploy Pages, but never start another full test cycle.
    paths-ignore:
      - 'badges/coverage.json'

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Test local prompt-cache benchmark protocol (stdlib only)
        run: python3 -m unittest discover -s scripts -p 'test_benchmark_prompt_cache.py'
      - run: npm run test:coverage
      - run: npm run test:coverage:core
      - name: Recalculate coverage badge
        run: npm run test:coverage:report
      - name: Commit updated coverage badge on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- badges/coverage.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add badges/coverage.json
            git commit -m "chore: update coverage badge"
            git push origin HEAD:main
          fi
      - run: npm run build
      - name: Build Storybook design-system reference
        run: npm run build-storybook
      - name: Install Playwright Chromium headless shell
        run: npx playwright install chromium --only-shell
      - name: Run browser-level diagnostic workflow tests
        run: npm run test:e2e
      - name: Upload visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-evidence
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-unit/
            coverage-unit-core/
          if-no-files-found: ignore
          retention-days: 14
