name: Local HTTPS launchers (Mac)
on:
  pull_request:
    paths:
      - 'tools/ollama-https-mac/**'
      - 'tools/lmstudio-https-mac/**'
      - 'tests/python/test_ollama_https.py'
      - 'tests/python/test_mac_https_keep_awake.py'
      - '.github/workflows/ollama-https-mac.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ollama-https-mac/**'
      - 'tests/python/test_ollama_https.py'
      - '.github/workflows/ollama-https-mac.yml'
jobs:
  https-proxy:
    name: HTTPS launcher / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test HTTPS proxies and Mac keep-awake launchers
        run: python3 -W error::ResourceWarning -m unittest discover -s tests/python -p 'test_*https*.py' -v
