name: Implement selective arbitration

on:
  push:
    branches:
      - fix/arbiter-final-score

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Implement selective arbitration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          Path('src/domain/diagnosticResolution.ts').write_text(r'''import type { CriterionProposal } from './grading.ts';
import type { Rubric } from './rubric.ts';

export const AUTOMATIC_ARBITRATION_MAX_DIFFERENCE = 1;

export interface DiagnosticResolution {
  automaticCriteria: CriterionProposal[];
  disputedCriterionIds: string[];
}

function confidence(first: CriterionProposal, second: CriterionProposal): CriterionProposal['confidence'] {
  return first.confidence === second.confidence ? first.confidence : 'medium';
}

/** Resolves close model scores locally; only materially different scores need the judge. */
export function resolveCloseDiagnosticCriteria(
  first: { criteria: CriterionProposal[] },
  second: { criteria: CriterionProposal[] },
  rubric: Rubric,
  maxDifference = AUTOMATIC_ARBITRATION_MAX_DIFFERENCE,
): DiagnosticResolution {
  const firstById = new Map(first.criteria.map((criterion) => [criterion.criterionId, criterion]));
  const secondById = new Map(second.criteria.map((criterion) => [criterion.criterionId, criterion]));
  const automaticCriteria: CriterionProposal[] = [];
  const disputedCriterionIds: string[] = [];

  for (const rubricCriterion of rubric.criteria) {
    const firstCriterion = firstById.get(rubricCriterion.id);
    const secondCriterion = secondById.get(rubricCriterion.id);
    if (!firstCriterion || !secondCriterion) {
      disputedCriterionIds.push(rubricCriterion.id);
      continue;
    }
    const difference = Math.abs(firstCriterion.points - secondCriterion.points);
    if (difference > maxDifference) {
      disputedCriterionIds.push(rubricCriterion.id);
      continue;
    }
    const points = Math.round(((firstCriterion.points + secondCriterion.points) / 2) * 100) / 100;
    automaticCriteria.push({
      criterionId: rubricCriterion.id,
      points,
      rationale: `Accord automatique : moyenne des deux avis (${firstCriterion.points} et ${secondCriterion.points}).`,
      evidence: `Avis 1 : ${firstCriterion.evidence} Avis 2 : ${secondCriterion.evidence}`.trim(),
      confidence: confidence(firstCriterion, secondCriterion),
    });
  }

  return { automaticCriteria, disputedCriterionIds };
}
''')

          test = Path('src/domain/diagnosticComparison.test.ts')
          text = test.read_text()
          text = text.replace("import { compareDiagnosticProposals } from './diagnosticComparison.ts';", "import { compareDiagnosticProposals } from './diagnosticComparison.ts';\nimport { resolveCloseDiagnosticCriteria } from './diagnosticResolution.ts';")
          text = text.replace("    { criterionId: 'knowledge', points: knowledge, rationale: '', evidence: '', confidence: 'high' },", "    { criterionId: 'knowledge', points: knowledge, rationale: '', evidence: '', confidence: 'high' },")
          text = text.replace("  it('omits criteria with equal scores and reports no false disagreement', () => {", "  it('keeps disagreements for comparison while selective resolution treats a one-point gap as automatic', () => {\n    const result = resolveCloseDiagnosticCriteria(proposal(6, 9), proposal(7, 6.5), rubric);\n    expect(result.disputedCriterionIds).toEqual(['reasoning']);\n    expect(result.automaticCriteria).toEqual([expect.objectContaining({ criterionId: 'knowledge', points: 6.5 })]);\n  });\n\n  it('does not call the judge for equal criteria', () => {\n    const result = resolveCloseDiagnosticCriteria(proposal(6, 9), proposal(6, 9), rubric);\n    expect(result.disputedCriterionIds).toEqual([]);\n    expect(result.automaticCriteria.map((criterion) => criterion.points)).toEqual([6, 9]);\n  });\n\n  it('routes a difference greater than one point to the judge', () => {\n    const result = resolveCloseDiagnosticCriteria(proposal(6, 9), proposal(6, 7.9), rubric);\n    expect(result.disputedCriterionIds).toEqual(['reasoning']);\n  });\n\n  it('omits criteria with equal scores and reports no false disagreement', () => {")
          test.write_text(text)

          grading = Path('src/domain/grading.ts')
          text = grading.read_text()
          text = text.replace("  /** Explicit total proposed by the model; validated against criterion points. */\n  finalScore: number;", "  /** Explicit total proposed by the model; validated against criterion points. */\n  finalScore: number;")
          grading.write_text(text)

          provider = Path('src/adapters/ai/ollamaProvider.ts')
          text = provider.read_text()
          text = text.replace("import type { DiagnosticModelResult, GradingProvider, GradingRequest, OllamaModel, OllamaSettings } from '../../ports/aiProvider.ts';", "import type { DiagnosticModelResult, GradingProvider, GradingRequest, OllamaModel, OllamaSettings } from '../../ports/aiProvider.ts';\nimport { parseGradingProposal } from '../../domain/grading.ts';\nimport { resolveCloseDiagnosticCriteria } from '../../domain/diagnosticResolution.ts';")
          start = text.index("      const runArbitration = async (firstResult: string, secondResult: string): Promise<string> => {")
          end = text.index("\n      if (strategy === 'single')", start)
          replacement = r'''      const runArbitration = async (firstResult: string, secondResult: string): Promise<string> => {
        const firstProposal = parseGradingProposal(firstResult, JSON.parse(request.rubric));
        const secondProposal = parseGradingProposal(secondResult, JSON.parse(request.rubric));
        const rubric = JSON.parse(request.rubric) as { title: string; criteria: Array<{ id: string; title: string; description: string; maxPoints: number }> };
        const resolution = resolveCloseDiagnosticCriteria(firstProposal, secondProposal, rubric);

        if (resolution.disputedCriterionIds.length === 0) {
          const automatic = {
            summary: 'Accord des deux évaluateurs ; aucune intervention du juge nécessaire.',
            criteria: resolution.automaticCriteria,
            questionsForTeacher: [],
            finalScore: resolution.automaticCriteria.reduce((sum, criterion) => sum + criterion.points, 0),
          };
          const raw = JSON.stringify(automatic);
          onDiagnosticResult?.({ kind: 'arbitrator', model: arbitratorModel, raw, elapsedMs: 0 });
          return raw;
        }

        const disputedIds = new Set(resolution.disputedCriterionIds);
        const disputedRubric = {
          title: rubric.title,
          criteria: rubric.criteria.filter((criterion) => disputedIds.has(criterion.id)),
        };
        const selectCriteria = (result: { criteria: Array<{ criterionId: string; points: number; rationale: string; evidence: string; confidence: string; questionForTeacher?: string }> }) => ({
          criteria: result.criteria.filter((criterion) => disputedIds.has(criterion.criterionId)),
        });
        const arbitrationPrompt = [
          'Tu es le juge final. Arbitre uniquement les critères litigieux entre deux évaluateurs.',
          'Pour chaque critère fourni, décide les points finaux à partir du barème et de la transcription. Ne refais pas une correction générale et ne moyenne pas les deux avis pour les critères litigieux.',
          'Retourne uniquement un JSON valide avec finalScore, summary, criteria et questionsForTeacher. criteria doit contenir exactement les critères fournis, avec criterionId, points, rationale, evidence, confidence et questionForTeacher. finalScore est la somme des points des critères fournis.',
          `BARÈME :\n${JSON.stringify(disputedRubric)}`,
          `TRANSCRIPTION :\n${transcription ?? ''}`,
          `AVIS 1 :\n${JSON.stringify(selectCriteria(firstProposal))}`,
          `AVIS 2 :\n${JSON.stringify(selectCriteria(secondProposal))}`,
        ].join('\n\n');
        const startedAt = Date.now();
        const raw = await sendStream(arbitratorModel, arbitrationPrompt, undefined, onChunk, true, settings.thinking ?? false);
        const judged = parseGradingProposal(raw, disputedRubric);
        const merged = {
          summary: judged.summary,
          criteria: [...resolution.automaticCriteria, ...judged.criteria].sort((a, b) => rubric.criteria.findIndex((criterion) => criterion.id === a.criterionId) - rubric.criteria.findIndex((criterion) => criterion.id === b.criterionId)),
          questionsForTeacher: judged.questionsForTeacher,
          finalScore: 0,
        };
        merged.finalScore = Math.round(merged.criteria.reduce((sum, criterion) => sum + criterion.points, 0) * 100) / 100;
        const mergedRaw = JSON.stringify(merged);
        onDiagnosticResult?.({ kind: 'arbitrator', model: arbitratorModel, raw: mergedRaw, elapsedMs: Date.now() - startedAt });
        return mergedRaw;
      };
'''
          text = text[:start] + replacement + text[end:]
          provider.write_text(text)

          # Add finalScore to existing proposal fixtures that predate the explicit contract.
          for path in Path('src').rglob('*.test.ts'):
            p = path.read_text()
            if 'GradingProposal' not in p and 'criteria:' not in p:
              continue
            if 'finalScore:' in p:
              continue
            if "const proposal =" in p:
              import re
              p = re.sub(r"(const proposal = \([^\n]+=> \(\{\n)(\s*summary:)", r"\1  finalScore: 0,\n\2", p)
              # Make fixture finalScore dynamic where it is a complete proposal helper.
              p = p.replace("  finalScore: 0,\n  summary: 'Proposition',", "  finalScore: knowledge + reasoning,\n  summary: 'Proposition',")
              path.write_text(p)
          PY
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test:run
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/diagnosticResolution.ts src/domain/diagnosticComparison.test.ts src/domain/grading.ts src/adapters/ai/ollamaProvider.ts src/**/*.test.ts
          git diff --cached --quiet || git commit -m "feat(arbitration): invoke judge only for material disagreements"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/implement-selective-arbitration.yml
          git commit -m "chore: remove temporary implementation workflow"
          git push
